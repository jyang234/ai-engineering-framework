- id: connection-leak-on-error
  type: failure
  title: "Connection not returned to pool on error paths"
  description: "When a caller encounters an error while using a connection and forgets to call Put(), the connection is leaked and never returned to the pool, eventually exhausting MaxSize."
  content: |
    Symptom: Pool exhaustion under error conditions. Get() blocks indefinitely
    because all connections are checked out but never returned.
    Root cause: The pool's Get/Put contract requires Put to be called for every
    successful Get, but error paths in caller code skip the Put call.
    Fix: While the pool itself can't force this, it should:
    1. Accept dead connections in Put() without panicking (discard them)
    2. Consider adding a connection wrapper with a finalizer or timeout
    The test verifies Put handles dead connections gracefully.
    Prevention: Always use defer pool.Put(conn) immediately after Get.
  tags: ["connection-leak", "pool", "error-handling"]
  pattern: "func.*Get.*Conn"
  anti_pattern: "(defer.*Put|IsAlive.*Close|!.*IsAlive.*Close)"
  detection:
    method: grep
    pattern: "(IsAlive|alive).*(Close|discard|remove)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Connection pool exhaustion from leaked connections"
      content: |
        Our connection pool ran out of connections because error paths didn't
        call Put(). When a database query failed, the caller returned the error
        without returning the connection. After MaxSize connections leaked, all
        subsequent Get() calls blocked forever.
        Fix: Always defer pool.Put(conn) immediately after a successful Get().
        The pool's Put() must handle dead/broken connections gracefully — check
        IsAlive() and Close() dead connections instead of returning them to idle.
      tags: ["connection-leak", "pool"]

- id: no-health-check-on-get
  type: failure
  title: "Pool returns dead connections without health checking"
  description: "Get() returns idle connections without checking IsAlive(), causing callers to receive broken connections."
  content: |
    Symptom: Callers intermittently get 'connection reset' or 'broken pipe' errors
    because the pool handed them a stale connection that was closed by the server.
    Root cause: Get() pulls a connection from the idle list and returns it directly
    without calling IsAlive() to verify it's still usable.
    Fix: In Get(), check IsAlive() on each idle connection before returning it.
    If it's dead, Close() and discard it, then try the next idle connection or
    create a new one:
      for {
          conn := p.getIdle()
          if conn == nil { break }
          if conn.IsAlive() { return conn, nil }
          conn.Close() // discard dead connection
      }
    Prevention: Always validate connections before returning them from a pool.
  tags: ["health-check", "connection-pool", "stale-connection"]
  pattern: "func.*Get.*Conn"
  anti_pattern: "IsAlive\\(\\)"
  detection:
    method: grep
    pattern: "IsAlive\\(\\)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Pool returned stale connections causing intermittent failures"
      content: |
        Our connection pool returned connections that had been closed by the
        remote server (idle timeout). Callers got 'broken pipe' errors on first
        use. The pool's Get() method pulled from the idle list without checking
        IsAlive().
        Fix: Before returning an idle connection, call IsAlive(). If false,
        Close() and discard it. Loop until you find a live connection or need
        to create a new one.
      tags: ["health-check", "connection-pool"]
