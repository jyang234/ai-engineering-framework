- id: body-not-closed
  type: failure
  title: "Request body not closed on error paths"
  description: "Not closing the HTTP request body on all code paths (especially error paths) causes resource leaks. The body must be closed with defer immediately after accessing it."
  content: |
    Symptom: Under load, the server runs out of file descriptors or connections because
    request bodies are not being returned to the pool.
    Root cause: The request body is only closed on the success path. When validation fails
    or JSON parsing errors occur, the body is left open.
    Fix: Always use defer r.Body.Close() as the first operation when accessing the body:
      defer r.Body.Close()
      data, err := io.ReadAll(r.Body)
    This ensures the body is closed regardless of which code path is taken.
    Prevention: Make defer body.Close() a reflexive pattern whenever touching r.Body.
  tags: ["http", "resource-leak", "body-close", "defer"]
  pattern: "io\\.ReadAll|ioutil\\.ReadAll"
  anti_pattern: "(defer.*Body\\.Close|defer.*\\.Close)"
  detection:
    method: grep
    pattern: "(defer.*Body\\.Close|defer.*\\.Close)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Request body resource leak in validation middleware"
      content: |
        Our JSON validation middleware was leaking request bodies. When validation failed
        (wrong content-type, oversized body, invalid JSON), we returned early without closing
        the body. Under load this caused connection exhaustion.
        Fix: Always defer r.Body.Close() immediately when entering the handler, before any
        validation logic. This guarantees cleanup on every code path.
      tags: ["http", "resource-leak", "body-close"]

- id: no-body-size-limit
  type: failure
  title: "No request body size limit allows denial of service"
  description: "Not limiting the request body size allows attackers to send arbitrarily large payloads, exhausting server memory."
  content: |
    Symptom: Server runs out of memory when processing large request bodies.
    Root cause: Using io.ReadAll(r.Body) without a size limit reads the entire body into
    memory, regardless of size. A malicious client can send gigabytes of data.
    Fix: Use http.MaxBytesReader to wrap the body before reading:
      r.Body = http.MaxBytesReader(w, r.Body, maxSize)
    Or use io.LimitReader:
      data, err := io.ReadAll(io.LimitReader(r.Body, maxSize))
    Prevention: Always enforce body size limits in any handler that reads the request body.
  tags: ["http", "security", "dos", "body-size"]
  pattern: "io\\.ReadAll\\(r\\.Body\\)"
  anti_pattern: "(MaxBytesReader|LimitReader|maxBodySize|MaxBody)"
  detection:
    method: grep
    pattern: "(MaxBytesReader|LimitReader|maxBodySize|MaxBody)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Denial of service via unbounded request body"
      content: |
        An attacker crashed our API server by sending a 2GB POST body to the validation
        endpoint. We were using io.ReadAll(r.Body) without any size limit, which tried to
        allocate the entire body in memory.
        Fix: Wrap the body with http.MaxBytesReader(w, r.Body, maxSize) before reading.
        Always enforce a maximum body size on any endpoint that reads request bodies.
      tags: ["http", "security", "dos", "body-size"]
