- id: partial-window-lost-on-stop
  type: failure
  title: "Stop() does not flush the current partial window"
  description: "Stop() stops the ticker and returns without flushing events accumulated in the current window, causing silent data loss for the last batch of events."
  content: |
    Symptom: Events emitted after the last window close but before Stop() are silently
    dropped. The final partial window's data is never delivered to emitFn.
    Root cause: Stop() stops the background ticker goroutine and returns without
    checking whether there are unflushed events in the current window map.
    Fix: In Stop(), after stopping the ticker, flush any remaining events:
      a.mu.Lock()
      window := a.window
      a.window = make(map[string]*accumulator)
      a.mu.Unlock()
      if len(window) > 0 {
          results := buildResults(window)
          a.emitFn(results)
      }
    Or simply call Flush() from Stop() before returning.
    Prevention: Any buffering or windowing system must flush on shutdown. Treat this
    as a mandatory part of the stop/shutdown sequence. This is the same pattern as
    batch processors losing data on shutdown.
  tags: ["data-loss", "shutdown", "flush", "windowing", "stream"]
  pattern: "func.*Stop"
  anti_pattern: "(Flush|flush|emitFn).*(Stop|stop|close)"
  detection:
    method: grep
    pattern: "(Flush|flush|emitFn)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Stream aggregator lost last window of events on shutdown"
      content: |
        Our stream aggregator silently dropped the last partial window of events on
        Stop(). With a 30-second window, up to 29 seconds of events were lost because
        Stop() only stopped the ticker without flushing the accumulated window data.
        This is the same class of bug as batch processors losing data on shutdown —
        any system that buffers must always flush before stopping.
        Fix: Stop() must flush the current partial window before returning. Either
        call Flush() from Stop(), or inline the flush logic after stopping the ticker.
      tags: ["data-loss", "shutdown", "stream", "windowing"]

- id: race-on-window-data
  type: failure
  title: "Race between background timer and Emit() on window map"
  description: "The background ticker goroutine reads and resets the window map while Emit() concurrently writes to it, causing data races detectable with -race."
  content: |
    Symptom: The -race detector reports concurrent map read/write, or the program
    panics with "concurrent map writes" under load. Intermittent incorrect aggregation
    results.
    Root cause: The background ticker goroutine iterates over the window map to build
    results and then resets it, while Emit() is simultaneously inserting or updating
    entries in the same map. Go maps are not safe for concurrent read/write access.
    Fix: Protect the window map with a sync.Mutex. Both the timer flush path and
    Emit() must acquire the lock before accessing the map:
      a.mu.Lock()
      // read or modify a.window
      a.mu.Unlock()
    For the flush path, swap out the map under the lock and release before calling
    emitFn to avoid holding the lock during the callback:
      a.mu.Lock()
      window := a.window
      a.window = make(map[string]*accumulator)
      a.mu.Unlock()
      if len(window) > 0 { a.emitFn(buildResults(window)) }
    Prevention: When a background goroutine and foreground methods share mutable state,
    every access must be synchronized. Use sync.Mutex to protect shared data structures.
  tags: ["race-condition", "concurrency", "mutex", "map", "stream"]
  pattern: "go func|go a\\."
  anti_pattern: "(sync\\.Mutex|sync\\.RWMutex)"
  detection:
    method: grep
    pattern: "(sync\\.Mutex|sync\\.RWMutex)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Data race in stream aggregator between timer and Emit"
      content: |
        Our stream aggregator had a data race between the background window timer and
        the Emit() method. Both accessed the window map concurrently — the timer read
        and reset it while Emit() inserted new entries. The -race detector caught this
        in CI, and we saw occasional panics with "concurrent map writes" in production.
        Fix: Protect the window map with sync.Mutex. Under the lock: swap out the
        current map for a fresh one, release the lock, then call emitFn with the old
        map's results. This ensures no concurrent access and avoids holding the lock
        during the potentially slow emit callback.
      tags: ["race-condition", "concurrency", "stream", "map"]
