- id: race-subscribe-publish
  type: failure
  title: "Data race between Subscribe and Publish"
  description: "Not synchronizing the subscriber list causes data races when Subscribe/Unsubscribe and Publish happen concurrently."
  content: |
    Symptom: Race detector fires. Under high concurrency, Publish iterates the
    subscriber slice while Subscribe appends to it, causing index out of range panics.
    Root cause: The subscriber list is a shared mutable slice accessed without synchronization.
    Fix: Use sync.RWMutex — read-lock during Publish (iterate), write-lock during
    Subscribe/Unsubscribe (modify):
      b.mu.RLock()
      handlers := b.topics[topic] // snapshot
      b.mu.RUnlock()
      for _, h := range handlers { h(msg) }
    Prevention: Any mutable collection shared between goroutines needs synchronization.
  tags: ["concurrency", "race-condition", "pub-sub", "mutex"]
  pattern: "func.*Publish.*topic"
  anti_pattern: "(sync\\.Mutex|sync\\.RWMutex)"
  detection:
    method: grep
    pattern: "(sync\\.Mutex|sync\\.RWMutex)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Race condition in event bus subscriber list"
      content: |
        Our event bus crashed with concurrent map read/write when Publish iterated
        the subscriber map while Subscribe modified it. The -race detector caught this
        immediately.
        Fix: Use sync.RWMutex to protect the subscriber map. Read-lock in Publish,
        write-lock in Subscribe/Unsubscribe. Copy the handler slice under lock before
        iterating to avoid holding the lock during handler execution.
      tags: ["concurrency", "race-condition", "pub-sub"]

- id: panic-crashes-bus
  type: failure
  title: "Handler panic crashes entire Publish loop"
  description: "Not recovering from panics in subscriber handlers means one bad handler can prevent all subsequent handlers from receiving the message."
  content: |
    Symptom: A panic in one subscriber's handler propagates up through Publish,
    skipping all remaining handlers and potentially crashing the application.
    Root cause: Publish iterates handlers in a loop without recover(). When one
    handler panics, the panic propagates and the remaining handlers never execute.
    Fix: Wrap each handler call in a deferred recover:
      for _, handler := range handlers {
          func() {
              defer func() { recover() }()
              handler(msg)
          }()
      }
    Prevention: Always recover from panics when calling user-provided callbacks.
  tags: ["panic", "recovery", "pub-sub", "fault-isolation"]
  pattern: "for.*handler.*range"
  anti_pattern: "(recover\\(\\)|defer.*recover)"
  detection:
    method: grep
    pattern: "recover\\(\\)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "One bad subscriber crashed entire event bus"
      content: |
        A subscriber handler panicked (nil pointer), which propagated through Publish()
        and crashed the application. Other subscribers on the same topic never received
        the message.
        Fix: Wrap each handler invocation in a function with deferred recover():
          func() { defer func() { recover() }(); handler(msg) }()
        This isolates panics so all handlers get called regardless.
      tags: ["panic", "recovery", "fault-isolation"]
