- id: no-connection-draining
  type: failure
  title: "Shutdown does not drain in-flight requests"
  description: "Calling http.Server.Close() instead of http.Server.Shutdown() kills in-flight connections immediately without waiting for them to complete."
  content: |
    Symptom: Clients receive connection reset errors during deployments. Long-running
    requests are interrupted mid-response.
    Root cause: Using srv.Close() terminates all connections immediately. The correct
    approach is srv.Shutdown(ctx) which stops accepting new connections but waits for
    in-flight requests to complete.
    Fix: Use http.Server.Shutdown(ctx) instead of Close():
      ctx, cancel := context.WithTimeout(context.Background(), 30*time.Second)
      defer cancel()
      srv.Shutdown(ctx)
    Prevention: Always use Shutdown for graceful termination. Only use Close as a
    last resort after Shutdown's context deadline is exceeded.
  tags: ["http", "graceful-shutdown", "connection-draining"]
  pattern: "\\.Close\\(\\)"
  anti_pattern: "\\.Shutdown\\("
  detection:
    method: grep
    pattern: "\\.Shutdown\\("
    files: ["*.go"]
  seeds:
    - type: failure
      title: "HTTP server killed in-flight requests on shutdown"
      content: |
        During deployments, our HTTP server dropped all in-flight requests because
        we called srv.Close() instead of srv.Shutdown(ctx). Close() terminates
        connections immediately; Shutdown() stops accepting new connections but
        waits for active requests to complete up to the context deadline.
        Fix: Replace srv.Close() with srv.Shutdown(ctx) using a context with timeout.
      tags: ["http", "graceful-shutdown"]

- id: signal-channel-leak
  type: failure
  title: "Signal channel not cleaned up with signal.Stop"
  description: "Calling signal.Notify without a matching signal.Stop leaks the signal channel and can interfere with signal handling in tests or long-running processes."
  content: |
    Symptom: Signal handling works once but breaks in tests or when the server is
    restarted. The leaked channel continues to receive signals.
    Root cause: signal.Notify registers a channel to receive signals, but if
    signal.Stop is never called, the channel remains registered forever.
    Fix: Always defer signal.Stop(sigCh) after signal.Notify:
      sigCh := make(chan os.Signal, 1)
      signal.Notify(sigCh, syscall.SIGINT, syscall.SIGTERM)
      defer signal.Stop(sigCh)
    Prevention: Treat signal.Notify/signal.Stop as a pair, like os.Open/Close.
  tags: ["signals", "resource-leak", "cleanup"]
  pattern: "signal\\.Notify"
  anti_pattern: "signal\\.Stop"
  detection:
    method: grep
    pattern: "signal\\.Stop"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Signal channel leak caused flaky tests"
      content: |
        Our HTTP server tests became flaky because signal.Notify channels from
        previous test runs were never cleaned up with signal.Stop. Signals sent
        in one test were received by channels from previous tests.
        Fix: Always pair signal.Notify with signal.Stop:
          sigCh := make(chan os.Signal, 1)
          signal.Notify(sigCh, ...)
          defer signal.Stop(sigCh)
      tags: ["signals", "resource-leak"]
