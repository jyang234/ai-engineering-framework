- id: goroutine-leak-on-cancel
  type: failure
  title: "Workers don't exit on context cancellation"
  description: "Workers block on sending to the output channel when the context is cancelled, causing goroutine leaks. The select in the worker's send path must include a ctx.Done() case."
  content: |
    Symptom: runtime.NumGoroutine() keeps growing after context cancellation.
    Workers appear to hang even after cancel() is called.
    Root cause: Workers run their stages and then try to send the Result to the
    output channel with a plain `out <- result`. If the output channel's consumer
    has stopped reading (because the context was cancelled), the send blocks
    forever and the worker goroutine leaks.
    Fix: Use a select when sending to the output channel so workers can bail out
    when the context is done:
      select {
      case out <- result:
      case <-ctx.Done():
          return
      }
    Also check ctx.Done() between stages and before reading from the input channel
    so workers exit promptly on cancellation.
    Prevention: Any goroutine that sends to a channel must have an escape hatch
    via context or a done channel. Never do a bare send inside a worker that
    should be cancellable.
  tags: ["goroutine-leak", "context-cancellation", "pipeline", "concurrency", "fan-out"]
  pattern: "out <-|output <-|ch <-"
  anti_pattern: "(select.*ctx\\.Done|case <-ctx\\.Done)"
  detection:
    method: grep
    pattern: "(select|case <-ctx\\.Done)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Pipeline worker goroutine leak on context cancellation"
      content: |
        Our fan-out/fan-in pipeline leaked worker goroutines when the context was
        cancelled. Workers completed their stage processing but then blocked
        forever trying to send results to the output channel — the consumer had
        already stopped reading.
        Fix: Wrap every send to the output channel in a select with ctx.Done():
          select {
          case out <- result:
          case <-ctx.Done():
              return
          }
        This ensures workers exit promptly when the context is cancelled, even
        if the output channel is full or unread. Same pattern applies to any
        worker-pool implementation that sends results on a channel.
      tags: ["goroutine-leak", "pipeline", "context-cancellation", "worker-pool"]

- id: output-channel-not-closed
  type: failure
  title: "Output channel never closed because workers are not tracked"
  description: "The output channel is never closed because there is no WaitGroup (or similar mechanism) tracking when all worker goroutines have finished. Consumers ranging over the output channel block forever."
  content: |
    Symptom: `for range output` blocks forever even after the input channel is
    closed and all items have been processed. The program hangs.
    Root cause: The code launches N worker goroutines that send to the output
    channel, but there is no coordination to detect when ALL workers have exited.
    Without a sync.WaitGroup tracking workers, nobody knows when it's safe to
    close the output channel, so it stays open indefinitely.
    Fix: Use sync.WaitGroup to track the worker goroutines, and close the output
    channel in a separate goroutine that waits for all workers:
      var wg sync.WaitGroup
      for i := 0; i < p.workers; i++ {
          wg.Add(1)
          go func() {
              defer wg.Done()
              // worker loop: read from input, run stages, send to output
          }()
      }
      go func() {
          wg.Wait()
          close(output)
      }()
    This guarantees the output channel is closed exactly once, after all workers
    have finished sending their results.
    Prevention: Every fan-out pattern needs a fan-in synchronization point. The
    standard Go pattern is WaitGroup + a closer goroutine. Never close a channel
    from inside a worker — use a dedicated goroutine that waits for all workers.
  tags: ["channel-close", "waitgroup", "pipeline", "fan-out", "fan-in", "concurrency"]
  pattern: "go func|close\\(.*out"
  anti_pattern: "(sync\\.WaitGroup|wg\\.Wait.*close|wg\\.Done)"
  detection:
    method: grep
    pattern: "(sync\\.WaitGroup|wg\\.Wait|wg\\.Done)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Pipeline output channel never closed — consumer hangs forever"
      content: |
        Our fan-out/fan-in pipeline's output channel was never closed. Consumers
        using `for result := range output` blocked forever after all items were
        processed. The pipeline launched worker goroutines but had no mechanism
        to detect when all workers had finished.
        Fix: Track workers with sync.WaitGroup. Each worker calls wg.Done() on
        exit. A dedicated goroutine waits on wg.Wait() and then closes the output
        channel:
          go func() { wg.Wait(); close(output) }()
        This is the standard Go fan-out/fan-in pattern: WaitGroup for tracking,
        separate goroutine for closing. Never close the channel from inside a
        worker — that races with other workers still sending.
      tags: ["channel-close", "waitgroup", "pipeline", "fan-out"]
