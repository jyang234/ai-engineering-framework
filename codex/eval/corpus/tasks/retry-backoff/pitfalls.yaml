- id: missing-jitter
  type: failure
  title: "Thundering herd from retry without jitter"
  description: "Exponential backoff without random jitter causes all retrying clients to hit the server simultaneously after each backoff period, creating a thundering herd effect."
  content: |
    Symptom: All retrying clients converge on the same retry time, causing load spikes.
    Root cause: Using fixed exponential backoff (delay = base * multiplier^attempt) without
    adding randomness means all clients that fail at the same time will retry at the same time.
    Fix: Add random jitter to each delay. Common approaches:
    - Full jitter: delay = random(0, base * multiplier^attempt)
    - Equal jitter: delay = base * multiplier^attempt / 2 + random(0, base * multiplier^attempt / 2)
    - Decorrelated jitter: delay = random(base, previous_delay * 3)
    The simplest effective approach is ±25% of the calculated delay.
    Prevention: Always add jitter to any backoff implementation.
  tags: ["retry", "backoff", "jitter", "thundering-herd", "distributed-systems"]
  pattern: "time\\.Sleep\\(.*Multiplier"
  anti_pattern: "(rand\\.|jitter|Jitter|math/rand|crypto/rand)"
  detection:
    method: grep
    pattern: "(rand\\.|jitter|Jitter|math/rand|crypto/rand)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Thundering herd from retry without jitter"
      content: |
        We experienced a cascading failure because our retry logic used fixed exponential
        backoff without jitter. When a downstream service hiccupped, all clients retried
        at the exact same intervals, creating synchronized load spikes that prevented recovery.
        Fix: Always add random jitter (±25% of delay) to exponential backoff.
      tags: ["retry", "backoff", "jitter", "thundering-herd"]

- id: no-context-check
  type: failure
  title: "Retry ignores context cancellation during wait"
  description: "Not checking context cancellation between retries causes the function to block for the full backoff duration even after the caller has given up."
  content: |
    Symptom: HTTP requests with timeouts take much longer than the timeout because the
    retry loop sleeps through the full backoff delay without checking the context.
    Root cause: Using time.Sleep() without a select on ctx.Done() means the goroutine
    is blocked and unresponsive to cancellation.
    Fix: Use a select statement with both a timer and ctx.Done():
      select {
      case <-time.After(delay):
      case <-ctx.Done():
          return ctx.Err()
      }
    Prevention: Always use context-aware waits in retry loops.
  tags: ["retry", "context", "cancellation", "timeout"]
  pattern: "time\\.Sleep\\("
  anti_pattern: "(ctx\\.Done|select\\s*\\{|<-ctx)"
  detection:
    method: grep
    pattern: "(ctx\\.Done|select\\s*\\{|<-ctx)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Retry loop ignores context cancellation"
      content: |
        Our retry implementation used time.Sleep() for backoff delays. When a request's
        context was cancelled (e.g., client disconnected), the retry loop continued sleeping
        for the full backoff duration instead of returning immediately.
        Fix: Replace time.Sleep with a select on both time.After and ctx.Done().
      tags: ["retry", "context", "cancellation"]
