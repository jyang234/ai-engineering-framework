- id: race-on-state
  type: failure
  title: "Data race on circuit breaker state transitions"
  description: "Not using proper synchronization (mutex or atomic operations) for circuit breaker state transitions causes data races when multiple goroutines call Do() concurrently."
  content: |
    Symptom: Intermittent panics or incorrect state under concurrent load. The -race
    detector flags reads and writes to the state and failure counter fields.
    Root cause: The circuit breaker state, failure count, and timestamp fields are
    read and written from multiple goroutines without synchronization.
    Fix: Protect all state transitions with a sync.Mutex:
      cb.mu.Lock()
      defer cb.mu.Unlock()
      // read and modify state
    Or use atomic operations for simple counters and state fields.
    Prevention: Any struct shared across goroutines must synchronize access to mutable fields.
  tags: ["concurrency", "race-condition", "mutex", "circuit-breaker"]
  pattern: "func.*Do.*func.*error"
  anti_pattern: "(sync\\.Mutex|sync\\.RWMutex|atomic\\.|sync/atomic)"
  detection:
    method: grep
    pattern: "(sync\\.Mutex|sync\\.RWMutex|atomic\\.|sync/atomic)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Race condition in circuit breaker state machine"
      content: |
        Our circuit breaker had a data race between the Do() method and the state
        transition logic. Under high concurrency, multiple goroutines could read the
        failure count, all decide to trip the breaker, and then race on resetting the
        count. The -race detector caught this in CI.
        Fix: Use sync.Mutex to protect all state transitions. Lock before reading state
        and failure count, and hold the lock through the state transition.
      tags: ["concurrency", "race-condition", "circuit-breaker"]

- id: incorrect-half-open
  type: failure
  title: "Half-open state does not limit concurrent requests"
  description: "In the half-open state, allowing unlimited concurrent requests defeats the purpose of the probe — if all requests succeed, we learn nothing about whether the downstream is truly recovered."
  content: |
    Symptom: When the circuit transitions to half-open, a flood of requests passes through
    instead of just one probe request. If the downstream is still struggling, this flood
    can make things worse.
    Root cause: The half-open state doesn't track how many requests are currently in-flight.
    It just allows all requests through, same as the closed state.
    Fix: Track the number of in-flight requests in half-open state. Only allow
    HalfOpenMaxRequests concurrent requests. Return ErrTooManyRequests for the rest.
    Use a counter (protected by the mutex) that increments when a request starts in
    half-open and decrements when it completes.
    Prevention: Half-open is a probe state — it must limit concurrency to test recovery safely.
  tags: ["circuit-breaker", "half-open", "concurrency", "probe"]
  pattern: "StateHalfOpen"
  anti_pattern: "(halfOpen.*[Cc]ount|[Cc]ount.*halfOpen|HalfOpen.*[Rr]equest|inFlight|in_flight)"
  detection:
    method: grep
    pattern: "(halfOpen|HalfOpen).*(count|Count|request|Request|inFlight|limit|Limit)"
    files: ["*.go"]
  seeds:
    - type: failure
      title: "Half-open circuit breaker flooded downstream"
      content: |
        Our circuit breaker's half-open state allowed all pending requests through instead
        of just a single probe. When a database recovered from an outage, the circuit went
        half-open and immediately sent 500 queued requests, crashing the database again.
        Fix: In half-open state, track in-flight requests with a counter. Only allow
        HalfOpenMaxRequests (typically 1) concurrent requests. Return ErrTooManyRequests
        for additional requests until the probe succeeds or fails.
      tags: ["circuit-breaker", "half-open", "cascading-failure"]
